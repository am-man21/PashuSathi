spring:
  application:
    name: pashusathi

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/pashusathi?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&characterEncoding=UTF-8}
    username: ${DB_USERNAME:pashu_app}
    password: ${DB_PASSWORD}          # no default on purpose: never commit passwords

  jpa:
    hibernate:
      ddl-auto: validate              # Flyway owns the schema; Hibernate only checks it
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: 8081
  servlet:
    encoding:
      charset: UTF-8
      force: true

app:
  upload-dir: ${UPLOAD_DIR:./uploads}