<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PashuSathi | पशुसाथी</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5 text-center">
    <h1 class="text-success">🐄 पशुसाथी / PashuSathi</h1>
    <p class="lead">A Smart Dairy &amp; Livestock Assistance Platform for Farmers</p>
    <button id="btn" class="btn btn-success btn-lg">Check backend</button>
    <pre id="out" class="mt-3 text-start d-inline-block"></pre>
</div>
<script>
    document.getElementById('btn').addEventListener('click', async () => {
      const out = document.getElementById('out');
      try {
        const res = await fetch('/api/health');
        out.textContent = JSON.stringify(await res.json(), null, 2);
      } catch (e) {
        out.textContent = 'Backend not reachable: ' + e.message;
      }
    });
</script>
</body>
</html>
