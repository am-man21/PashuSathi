<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register Dairy | पशुसाथी</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4" style="max-width: 560px;">
    <h2 class="text-success text-center mb-3">🐄 डेयरी रजिस्ट्रेशन / Register Dairy</h2>
    <div class="card shadow-sm"><div class="card-body p-4">
        <div id="alert" class="alert alert-danger d-none" role="alert"></div>
        <form id="regForm">
            <div class="mb-3"><label class="form-label" for="dairyName">डेयरी का नाम / Dairy name *</label>
                <input class="form-control" id="dairyName" required maxlength="150"></div>
            <div class="mb-3"><label class="form-label" for="address">पता / Address</label>
                <input class="form-control" id="address" maxlength="255"></div>
            <div class="mb-3"><label class="form-label" for="contactPhone">मोबाइल / Phone</label>
                <input class="form-control" id="contactPhone" maxlength="20"></div>
            <div class="mb-3"><label class="form-label" for="fullName">आपका नाम / Your name *</label>
                <input class="form-control" id="fullName" required maxlength="120"></div>
            <div class="mb-3"><label class="form-label" for="username">उपयोगकर्ता नाम / Username *</label>
                <input class="form-control" id="username" required minlength="4" maxlength="60" autocomplete="username"></div>
            <div class="mb-3"><label class="form-label" for="password">पासवर्ड / Password * (8+ chars, letter and digit)</label>
                <input class="form-control" id="password" type="password" required minlength="8" maxlength="72" autocomplete="new-password"></div>
            <button class="btn btn-success btn-lg w-100" id="btn" type="submit">रजिस्टर करें / Register</button>
        </form>
        <p class="mt-3 mb-0 text-center">पहले से खाता है? <a href="/login.html">Login</a></p>
    </div></div>
</div>
<script src="/js/api.js"></script>
<script>
    const alertBox = document.getElementById('alert');
    const val = id => { const v = document.getElementById(id).value.trim(); return v === '' ? null : v; };
    document.getElementById('regForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn'); btn.disabled = true;
      try {
        await Api.post('/api/auth/register-dairy', {
          dairyName: val('dairyName'), address: val('address'), contactPhone: val('contactPhone'),
          fullName: val('fullName'), username: val('username'),
          password: document.getElementById('password').value });
        location.href = '/login.html?registered=1';
      } catch (err) {
        let msg = err.message;
        if (err.data && err.data.fieldErrors) msg = Object.values(err.data.fieldErrors).join(' | ');
        alertBox.textContent = msg; alertBox.classList.remove('d-none');
        btn.disabled = false;
      }
    });
</script>
</body>
</html>
